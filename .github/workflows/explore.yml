name: explore
on:
  push:
    branches: [explore-sources]
permissions:
  contents: read
jobs:
  explore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - run: ./gradlew genSources -q
      - name: Extract sources
        run: |
          JAR=$(find ~/.gradle .gradle -name "*minecraft*sources.jar" 2>/dev/null | head -1)
          echo "JAR=$JAR"
          mkdir src-mc && cd src-mc && unzip -q "$JAR"
      - name: Dump
        working-directory: src-mc
        run: |
          f() { echo "=================== $1"; cat "$(find . -path "*/$1" | head -1)"; }
          f net/minecraft/client/renderer/rendertype/RenderTypes.java | grep -nE "public static|RenderType\.create|RenderSetup" | head -120
          f net/minecraft/client/renderer/rendertype/RenderType.java | grep -nE "public|static" | head -60
          f net/minecraft/client/renderer/rendertype/RenderSetup.java | grep -nE "public|static" | head -60
          f net/minecraft/client/renderer/RenderPipelines.java | grep -nE "LINES|DEBUG|FILLED|QUADS|SNIPPET" | head -80
          f net/minecraft/client/renderer/RenderPipelines.java | grep -nE -A12 "LINES = |DEBUG_FILLED_BOX = " | head -80
          f net/minecraft/client/renderer/ShapeRenderer.java | head -120
          echo "=================== VertexConsumer"; grep -nE "default|VertexConsumer [a-z]+\(" $(find . -name VertexConsumer.java) | head -40
          echo "=================== Camera getters"; grep -nE "public .*\(" $(find . -path "*/client/Camera.java") | head -40
          echo "=================== BlockEntity iteration"; grep -nE "getBlockEntities|blockEntities\(" -r net/minecraft/world/level/chunk/LevelChunk.java | head
          echo "=================== ClientChunkCache"; grep -nE "public .*\(" $(find . -name ClientChunkCache.java) | head -30
          echo "=================== LevelRenderContext"; true
