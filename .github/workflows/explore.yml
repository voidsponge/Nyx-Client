name: explore
on:
  push:
    branches: [explore-sources]
permissions:
  contents: read
jobs:
  explore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - run: ./gradlew genSources -q
      - name: Extract sources
        run: |
          JAR=$(realpath "$(find ~/.gradle .gradle -name "*minecraft*sources.jar" 2>/dev/null | head -1)")
          echo "JAR=$JAR"
          mkdir src-mc && cd src-mc && unzip -q "$JAR"
      - name: Dump
        working-directory: src-mc
        run: |
          RP=$(find . -path "*/client/renderer/RenderPipelines.java")
          RT=$(find . -path "*/rendertype/RenderTypes.java")
          echo "=== snippets"; sed -n '35,60p;310,375p' $RP
          echo "=== lines pipelines"; sed -n '1020,1070p' $RP
          echo "=== register"; grep -n "static .* register(" -A6 $RP
          echo "=== RenderTypes lines/debug"; grep -nE "lines|LINES|debug|DEBUG" $RT | head -60
          echo "=== RenderTypes debugFilledBox def"; grep -nE -B2 -A8 "DEBUG_FILLED_BOX =|RenderType debugFilledBox|RenderType lines\(" $RT | head -60
          echo "=== ShapeRenderer"; cat $(find . -name ShapeRenderer.java) | head -150
          echo "=== Pipeline jar classes"; find ~/.gradle -name "*.jar" | xargs -I{} sh -c 'unzip -l {} 2>/dev/null | grep -q "renderpearl/api/pipeline/RenderPipeline.class" && echo {}' | head -3
