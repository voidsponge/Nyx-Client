name: explore
on:
  push:
    branches: [explore-sources]
permissions:
  contents: read
jobs:
  explore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - run: ./gradlew genSources -q
      - name: Extract sources
        run: |
          JAR=$(realpath "$(find ~/.gradle .gradle -name "*minecraft*sources.jar" 2>/dev/null | head -1)")
          echo "JAR=$JAR"
          mkdir src-mc && cd src-mc && unzip -q "$JAR"
      - name: Dump
        working-directory: src-mc
        run: |
          RP=$(find . -path "*/client/renderer/RenderPipelines.java")
          RT=$(find . -path "*/rendertype/RenderTypes.java")
          PL=$(find . -path "*/pipeline/RenderPipeline.java" | head -1)
          echo "=== snippets"; sed -n '310,362p' $RP
          echo "=== see-through/depth in RenderPipelines"; grep -nE "SEE_THROUGH|NO_DEPTH|ALWAYS_PASS|DepthStencilState" $RP | head -30
          echo "=== lines pipelines"; sed -n '1026,1068p' $RP
          echo "=== RenderTypes LINES"; sed -n '472,494p' $RT
          echo "=== RenderPipeline builder ($PL)"; grep -nE "public .*Builder with[A-Za-z]+\(|public RenderPipeline build|public static .*builder" $PL | head -40
          echo "=== DepthStencilState"; cat $(find . -name DepthStencilState.java | head -1) | grep -nE "public|record|static" | head -20
          echo "=== CompareOp"; cat $(find . -name CompareOp.java | head -1) | head -30
          echo "=== VertexConsumer lineWidth"; grep -nE "LineWidth|lineWidth" $(find . -name VertexConsumer.java) | head
          echo "=== DefaultVertexFormat"; grep -nE "public static final VertexFormat" $(find . -name DefaultVertexFormat.java) | head -20
