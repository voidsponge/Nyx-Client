name: release

# Chaque merge sur main publie une release GitHub avec le jar.
# La version vient de gradle.properties : pense à l'augmenter sur develop avant d'ouvrir la PR vers main.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # créer le tag et la release
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Setup JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: Read version
        id: version
        run: echo "tag=v$(grep '^version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - name: Check tag is new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::La release $TAG existe déjà. Augmente 'version' dans gradle.properties."
            exit 1
          fi
      - name: Build
        run: ./gradlew build
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" build/libs/nyx-client-*.jar \
            --target "$GITHUB_SHA" \
            --title "Nyx Client $TAG" \
            --generate-notes
